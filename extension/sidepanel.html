<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>LifeDesk — Captura rápida</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; background: #0b1220; color: #e2e8f0;
    font: 14px/1.45 system-ui, -apple-system, sans-serif; }
  h1 { font-size: 16px; margin: 0 0 2px; letter-spacing: -.02em; }
  .sub { color: #64748b; font-size: 12px; margin: 0 0 16px; }
  .badge { display: inline-block; font-size: 11px; font-weight: 600;
    background: rgba(34,197,94,.15); color: #4ade80;
    border: 1px solid rgba(34,197,94,.4); border-radius: 999px;
    padding: 2px 10px; margin-bottom: 14px; }
  label { display: block; font-size: 12px; color: #94a3b8; margin: 10px 0 4px; }
  input, select, textarea { width: 100%; padding: 8px 10px; background: #111a2e;
    color: #e2e8f0; border: 1px solid #283548; border-radius: 8px; font: inherit; }
  input:focus, select:focus, textarea:focus { outline: 1px solid #22c55e; }
  textarea { resize: vertical; min-height: 56px; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  button { width: 100%; margin-top: 14px; padding: 10px; background: #22c55e;
    color: #052e16; border: none; border-radius: 8px; font: inherit;
    font-weight: 700; cursor: pointer; }
  button:hover { background: #16a34a; }
  button:disabled { opacity: .5; cursor: default; }
  .ghost { background: transparent; color: #64748b; border: 1px solid #283548;
    font-weight: 500; margin-top: 8px; }
  .ghost:hover { background: #111a2e; color: #94a3b8; }
  .msg { margin-top: 10px; font-size: 12px; min-height: 16px; }
  .msg.ok { color: #4ade80; }
  .msg.err { color: #f87171; }
  .hidden { display: none; }
</style>
</head>
<body>
  <h1>LifeDesk</h1>
  <p class="sub">Captura rápida de leads</p>

  <div id="view-login">
    <label for="li-email">Email</label>
    <input id="li-email" type="email" autocomplete="username" />
    <label for="li-pass">Contraseña</label>
    <input id="li-pass" type="password" autocomplete="current-password" />
    <button id="btn-login">Iniciar sesión</button>
    <div id="login-msg" class="msg"></div>
  </div>

  <div id="view-form" class="hidden">
    <span id="portal-badge" class="badge hidden"></span>
    <label for="f-name">Nombre *</label>
    <input id="f-name" required />
    <label for="f-phone">Teléfono *</label>
    <input id="f-phone" required />
    <label for="f-email">Email</label>
    <input id="f-email" type="email" />
    <div class="row">
      <div><label for="f-city">Ciudad</label><input id="f-city" /></div>
      <div><label for="f-age">Edad</label><input id="f-age" type="number" min="0" max="120" /></div>
    </div>
    <div class="row">
      <div>
        <label for="f-product">Producto</label>
        <select id="f-product">
          <option>Term Life</option><option>Whole Life</option>
          <option>Final Expense</option><option>IUL</option>
          <option>Annuity</option><option>Salud & Vida</option>
        </select>
      </div>
      <div>
        <label for="f-status">Estado</label>
        <select id="f-status">
          <option>New Lead</option><option>Contacted</option>
          <option>Quoted</option><option>Follow-Up</option>
        </select>
      </div>
    </div>
    <label for="f-notes">Notas</label>
    <textarea id="f-notes"></textarea>
    <button id="btn-save">Guardar lead</button>
    <button id="btn-logout" class="ghost">Cerrar sesión</button>
    <div id="form-msg" class="msg"></div>
  </div>

  <script src="config.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
